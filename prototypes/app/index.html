<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>问数工作台 · DataOcean</title>
  <link rel="icon" href="assets/dataocean-mark.png">
  <link rel="stylesheet" href="../shared/vendor/element-plus-2.14.0.css">
  <link rel="stylesheet" href="workbench.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="answers.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="case-view.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="account-view.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="../后台管理/admin-system.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="../后台管理/access-requests.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="../后台管理/grant-history.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="../后台管理/record-controls.css?v=element-controls-20261108-r3">
  <link rel="stylesheet" href="../后台管理/record-table.css?v=element-controls-20261108-r3">
  <script defer src="../shared/vendor/vue-3.5.34.global.prod.js"></script>
  <script defer src="../shared/vendor/element-plus-2.14.0.min.js"></script>
  <script defer src="../shared/vendor/element-plus-zh-cn-2.14.0.min.js"></script>
  <script defer src="../shared/element-adapter.js?v=element-controls-20261108-r3"></script>
  <script defer src="icons.js?v=element-controls-20261108-r3"></script>
  <script defer src="account-access.js?v=element-controls-20261108-r3"></script>
  <script defer src="dialogue.js?v=element-controls-20261108-r3"></script>
  <script defer src="answers.js?v=element-controls-20261108-r3"></script>
  <script defer src="cases.js?v=element-controls-20261108-r3"></script>
  <script defer src="case-view.js?v=element-controls-20261108-r3"></script>
  <script defer src="../后台管理/record-query.js?v=element-controls-20261108-r3"></script>
  <script defer src="../后台管理/record-controls.js?v=element-controls-20261108-r3"></script>
  <script defer src="../后台管理/record-table.js?v=element-controls-20261108-r3"></script>
  <script defer src="account-view.js?v=element-controls-20261108-r3"></script>
  <script defer src="../后台管理/grant-history.js?v=element-controls-20261108-r3"></script>
  <script defer src="../后台管理/access-requests.js?v=element-controls-20261108-r3"></script>
  <script defer src="workbench.js?v=element-controls-20261108-r3"></script>
</head>
<body>
  <div class="screen" id="manager-page">
    <aside class="side" id="sidebar" aria-label="问数会话">
      <div class="brand">
        <img src="assets/dataocean-mark.png" alt=""><span lang="en">DataOcean</span>
        <button type="button" class="sidebar-close" aria-label="关闭会话导航"><i data-icon="x"></i></button>
      </div>
      <button type="button" class="new" id="new-chat"><i data-icon="square-pen"></i>新建问数 <span class="key" aria-hidden="true">＋</span></button>
      <button type="button" class="finder" id="find-chat" aria-expanded="false" aria-controls="history-filter"><i data-icon="search"></i>搜索对话</button>
      <input class="search-box" id="history-filter" type="search" placeholder="按标题查找" aria-label="按标题搜索对话" hidden>
      <nav class="history-list" id="history" aria-label="最近的对话"></nav>
      <details class="profile profile-more">
        <summary aria-label="周店长，城南店，用户菜单" aria-controls="profile-options">
          <span class="face" aria-hidden="true">周</span>
          <span class="profile-label"><strong>周店长</strong><small>城南店</small></span>
          <i data-icon="chevron-down"></i>
        </summary>
        <div id="profile-options">
          <a href="#account"><i data-icon="user-round"></i><span>个人管理</span></a>
          <a id="enter-admin" href="#admin/access-requests" hidden><i data-icon="layers"></i><span>后台管理</span></a>
        </div>
      </details>
      <details class="prototype-tools" id="prototype-tools" hidden>
        <summary>原型评审</summary>
        <div><a href="../项目运行图.html">项目运行图</a><a href="../visual-directions/index.html">视觉选稿</a><button type="button" id="reset-demo">重置演示数据</button></div>
      </details>
    </aside>
    <button class="scrim" type="button" aria-label="收起会话导航" tabindex="-1" hidden></button>
    <main class="main" id="workspace">
      <header class="bar">
        <div class="crumb">
          <button class="menu-toggle" type="button" aria-label="打开会话导航" aria-expanded="false" aria-controls="sidebar"><i data-icon="menu"></i></button>
          <span>问数工作台</span><i data-icon="chevron-right"></i><b id="thread-title">牛奶净销量</b>
        </div>
        <div class="bar-tools">
          <div class="source" aria-label="当前数据源为经营数据，门店为城南店"><i data-icon="database"></i>经营数据<span class="line"></span>城南店</div>
          <button type="button" id="open-receipts" class="receipt-trigger" aria-haspopup="dialog" aria-controls="receipts" aria-label="处理回告"><i data-icon="bell"></i><span class="receipt-label">回告</span><span id="receipt-count" hidden></span></button>
        </div>
      </header>
      <section class="transcript" id="transcript" aria-label="当前对话记录" tabindex="0"></section>
      <footer class="composer-area">
        <form class="composer" id="composer">
          <textarea id="message" rows="1" aria-label="提问、补充或修改条件" placeholder="继续提问，也可以补充或修改条件…"></textarea>
          <div class="compose-tools"><span class="scope-pill"><i data-icon="database"></i>经营数据</span><button type="submit" class="send" aria-label="发送消息" title="发送消息（Enter）" disabled><i data-icon="arrow-up"></i></button></div>
        </form>
        <p class="sample">示例数据 · 城南店经营</p>
      </footer>
    </main>
  </div>
  <main id="approvals-page" aria-label="后台管理" tabindex="-1" hidden></main>
  <main id="account-page" aria-label="个人管理" tabindex="-1" hidden></main>
  <dialog id="receipts" class="receipt-dialog" aria-labelledby="receipt-title">
    <header><h2 id="receipt-title">处理回告</h2><button type="button" class="receipt-close" aria-label="关闭处理回告"><i data-icon="x"></i></button></header>
    <div id="receipt-list"></div>
  </dialog>
</body>
</html>
