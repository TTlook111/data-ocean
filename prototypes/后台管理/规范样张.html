<body>
  <div class="specimen">
    <header class="topbar">
      <div class="brand"><img src="../app/assets/dataocean-mark.png" alt=""><strong>DataOcean</strong><nav id="spec-breadcrumb" class="spec-caption prototype-ui" aria-label="页面层级"></nav></div>
      <div class="top-actions"><button id="measure" type="button" class="button" aria-pressed="false">间距标注</button></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <nav class="nav" aria-label="规范样张菜单">
          <h2 class="nav-heading">权限管理</h2>
          <button type="button" data-view="requests" aria-current="page"><span data-icon="inbox"></span>访问申请</button>
          <button type="button" data-view="grants"><span data-icon="layers"></span>授权记录</button>
        </nav>
        <div class="sample-controls"><label for="sample-count">示例数据状态</label><select id="sample-count" aria-label="示例数据数量"><option value="0">0 条 · 空状态</option><option value="1">1 条 · 少量记录</option><option value="10">10 条 · 整页记录</option><option value="11">11 条 · 分页边界</option><option value="105" selected>105 条 · 多页记录</option><option value="long">超长内容 · 全列检查</option></select><p class="spec-note">仅用于核对布局和间距。</p></div>
      </aside>
      <main class="workspace" data-measure="工作区四边 24px · 区块间距 24px">
        <div class="page-heading"><h1 id="page-title">访问申请</h1></div>
        <div id="query-slot" class="spec-query-slot" data-measure="共用查询组件 · 四边内距 24px · 字段组间距 16px"></div>
        <section class="rl-result-panel results" id="results-panel" aria-label="访问申请查询结果" data-measure="同一结果面板 · 表头、内容与分页">
        </section>
      </main>
    </div>
  </div>
  <dialog id="record-dialog" class="record-dialog" aria-labelledby="record-dialog-title">
    <header><h2 id="record-dialog-title">记录完整内容</h2><button id="close-record" class="button close-record" type="button" aria-label="关闭记录详情"><span data-icon="x"></span></button></header>
    <div class="record-body"><dl id="record-fields"></dl></div>
  </dialog>
  <div id="action-feedback" class="do-feedback" popover="manual" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const examples = [
        { id: 'SQ-001', person: '周店长', purpose: '核对上周门店经营周报', submitted: '11/08 09:30', status: 'pending' },
        { id: 'SQ-002', person: '李店长', purpose: '准备上周毛利分析', submitted: '11/08 09:15', status: 'approved' },
        { id: 'SQ-003', person: '王店长', purpose: '核对上周销售成本', submitted: '11/08 09:00', status: 'pending' },
        { id: 'SQ-004', person: '陈店长', purpose: '复核上周经营数据', submitted: '11/07 16:45', status: 'pending' },
        { id: 'SQ-005', person: '赵店长', purpose: '核对门店经营周报', submitted: '11/07 16:30', status: 'approved' },
        { id: 'SQ-006', person: '杨店长', purpose: '复盘上周门店毛利', submitted: '11/07 16:15', status: 'pending' },
        { id: 'SQ-007', person: '刘店长', purpose: '准备月度经营复盘', submitted: '11/07 16:00', status: 'approved' },
        { id: 'SQ-008', person: '黄店长', purpose: '核对同期成本归属', submitted: '11/07 15:45', status: 'pending' },
        { id: 'SQ-009', person: '吴店长', purpose: '核验上周毛利额', submitted: '11/07 15:30', status: 'pending' },
        { id: 'SQ-010', person: '徐店长', purpose: '准备经营例会数据', submitted: '11/07 15:15', status: 'approved' }
      ];
      // 保留少量与长内容场景，默认用多页数据核对真实翻页和末页数量。
      examples.push(...Array.from({ length: 95 }, (_, index) => ({
        ...examples[index % 10], id: 'SQ-' + String(index + 11).padStart(3, '0'),
        submitted: '2026/11/' + String(6 - Math.floor(index / 20)).padStart(2, '0') + ' 09:' + String(59 - index % 60).padStart(2, '0')
      })));
      const longExamples = [
        {
          id: 'SQ-20261108-' + 'DATAOCEAN-REVIEW-'.repeat(8) + '编号末尾',
          title: '城南片区直营门店上周经营复盘及跨周退货归属核对的毛利汇总访问申请',
          person: '城南片区直营事业部经营分析组负责人周店长',
          purpose: ('用于核对上周各门店经营周报、跨周退货以及销售成本归属，形成经营例会所需的毛利说明。\n').repeat(8) + '原因完整末尾',
          scope: '华东零售事业部城南片区直营门店经营汇总及获准计算依据的适用业务范围',
          resource: '门店毛利汇总与经营分析所需销售净额和成本依据的只读权限',
          submitted: '2026/11/08 09:30', status: 'pending'
        },
        {
          id: 'SQ-' + 'LONGUNBROKENIDENTIFIER'.repeat(7) + '-END',
          title: 'MONTHLYBUSINESSPERFORMANCEREVIEW'.repeat(8) + 'TITLE-END',
          person: 'RegionalBusinessOperationsAnalysisManager'.repeat(3) + '-PERSON-END',
          purpose: '连续英文与符号样例 [A+B] <记录>\n' + 'COSTANDRETURNSANALYSISEVIDENCE'.repeat(16) + 'PURPOSE-END',
          scope: 'AUTHORIZEDBUSINESSRESOURCESCOPE'.repeat(7) + '-SCOPE-END',
          resource: 'GROSSPROFITANDCALCULATIONBASIS'.repeat(5) + '-RESOURCE-END',
          submitted: '2026/11/08 09:15', status: 'approved'
        }
      ];
      let view = 'requests';
      let sampleMode = '105';
      const defaults = { keyword: '', status: 'all', fromDate: '', toDate: '', page: 1, pageSize: 10 };
      let applied = { ...defaults };
      const recordDialog = document.getElementById('record-dialog');
      const recordFields = document.getElementById('record-fields');
      const feedback = document.getElementById('action-feedback');
      let activeDropdown;
      let menuTrigger;
      let feedbackTimer;
      let recordReturnFocus;
      const pageLocation = Vue.reactive({ title: '访问申请' });
      PrototypeUI.mount(document.getElementById('spec-breadcrumb'), {
        setup: () => () => Vue.h(ElementPlus.ElBreadcrumb, { separator: '/' }, { default: () => [
          Vue.h(ElementPlus.ElBreadcrumbItem, null, { default: () => '规范样张' }),
          Vue.h(ElementPlus.ElBreadcrumbItem, { 'aria-current': 'page' }, { default: () => pageLocation.title })
        ] })
      });
      for (const slot of document.querySelectorAll('[data-icon]')) slot.replaceWith(WorkbenchIcon(slot.dataset.icon));

      function text(tag, content, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = content;
        return node;
      }

      function valuesFor(item, isRequests) {
        return {
          subject: isRequests ? item.title || '城南店毛利汇总访问申请' : item.resource || '仅毛利额',
          description: isRequests ? item.purpose : (item.scope || '城南店经营汇总') + ' · 14 天',
          person: item.person,
          date: isRequests ? item.submitted : '2026/11/22 09:30',
          status: isRequests ? (item.status === 'pending' ? '待审批' : '待执行') : '已生效',
          id: item.id
        };
      }

      function clippedText(tag, value, className = '') {
        const node = text(tag, value, 'cell-text ' + className);
        node.title = value;
        return node;
      }

      function showRecord(item, isRequests, returnFocus) {
        closeActions();
        recordReturnFocus = returnFocus || document.activeElement;
        const value = valuesFor(item, isRequests);
        const fields = [
          [isRequests ? '申请事项' : '获准范围', value.subject],
          [isRequests ? '业务用途' : '适用范围', value.description],
          ['申请人', value.person],
          [isRequests ? '提交时间' : '有效至', value.date],
          ['状态', value.status],
          [isRequests ? '申请编号' : '来源申请', value.id]
        ];
        recordFields.replaceChildren();
        for (const [label, content] of fields) {
          const field = text('div', '', 'record-field');
          field.append(text('dt', label), text('dd', content));
          recordFields.append(field);
        }
        recordDialog.showModal();
      }

      function notify(message, failed = false) {
        clearTimeout(feedbackTimer);
        feedback.dataset.error = String(failed);
        feedback.replaceChildren(WorkbenchIcon(failed ? 'info' : 'circle-check', 16), text('span', message));
        if (!feedback.matches(':popover-open')) feedback.showPopover();
        feedbackTimer = setTimeout(() => feedback.hidePopover(), 3500);
      }

      function closeActions() {
        activeDropdown?.handleClose();
      }

      async function copyValue(value, label, item, isRequests, returnFocus = document.activeElement) {
        closeActions();
        try {
          await navigator.clipboard.writeText(value);
          notify('已复制' + label);
        } catch {
          showRecord(item, isRequests, returnFocus);
          notify('复制未完成，可在详情中选择文字复制。', true);
        }
      }

      function rowActions(item, isRequests) {
        const controls = text('div', '', 'row-actions do-actions');
        const viewButton = text('button', '查看', 'do-action is-primary');
        viewButton.type = 'button';
        viewButton.dataset.rowAction = 'view';
        viewButton.setAttribute('aria-label', '查看记录全文 ' + item.id);
        viewButton.addEventListener('click', () => showRecord(item, isRequests, viewButton));
        // 规范样张也复用真实下拉组件，低频复制动作集中在文字“更多”菜单中。
        const more = text('span', '', 'prototype-ui');
        PrototypeUI.mount(more, {
          setup() {
            const dropdown = Vue.ref();
            const dismiss = event => { if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); dropdown.value.handleClose(); more.querySelector('button').focus(); } };
            Vue.onMounted(() => more.querySelector('.spec-more-chevron').append(WorkbenchIcon('chevron-down', 14)));
            return () => Vue.h(ElementPlus.ElDropdown, { ref: dropdown, trigger: 'click', placement: 'bottom-end', popperClass: 'prototype-ui-popper',
              onKeydownCapture: dismiss,
              onVisibleChange: visible => { if (visible) { activeDropdown = dropdown.value; menuTrigger = more.querySelector('button'); } else if (activeDropdown === dropdown.value) activeDropdown = null; },
              onCommand: key => { const value = valuesFor(item, isRequests); copyValue(key === 'id' ? item.id : key === 'description' ? value.description : item.person, key === 'id' ? '编号' : key === 'description' ? (isRequests ? '用途' : '适用范围') : '申请人', item, isRequests, menuTrigger); }
            }, {
              default: () => Vue.h(ElementPlus.ElButton, { link: true, nativeType: 'button', class: 'spec-more', 'data-row-action': 'more', 'aria-label': '更多记录操作 ' + item.id }, { default: () => ['更多', Vue.h('span', { class: 'spec-more-chevron', 'aria-hidden': 'true' })] }),
              dropdown: () => Vue.h(ElementPlus.ElDropdownMenu, { onKeydownCapture: dismiss }, { default: () => [['id', '复制编号'], ['description', isRequests ? '复制用途' : '复制适用范围'], ['person', '复制申请人']].map(([command, label]) => Vue.h(ElementPlus.ElDropdownItem, { command }, { default: () => label })) })
            });
          }
        });
        controls.append(viewButton, more);
        return controls;
      }

      function render(focusKey) {
        closeActions();
        const isRequests = view === 'requests';
        const title = isRequests ? '访问申请' : '授权记录';
        pageLocation.title = title;
        document.getElementById('page-title').textContent = title;
        document.getElementById('results-panel').setAttribute('aria-label', title + '查询结果');
        document.querySelectorAll('[data-view]').forEach(button => {
          if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        const headings = isRequests ? ['申请事项', '申请人', '提交时间', '状态', '操作'] : ['获准范围', '申请人', '有效至', '状态', '操作'];
        const form = RecordControls.filters({
          value: applied,
          statuses: [{ value: 'all', label: '全部状态' }, ...(isRequests
            ? [{ value: 'pending', label: '待审批' }, { value: 'approved', label: '待执行' }]
            : [{ value: 'effective', label: '已生效' }])],
          keywordLabel: '关键词', keywordPlaceholder: '申请编号、申请人或业务用途',
          dateLabel: isRequests ? '提交日期' : '生效日期',
          onApply: value => { applied = value; render('keyword'); },
          onReset: () => { applied = { ...defaults, pageSize: applied.pageSize }; render('keyword'); }
        });
        form.id = 'query';
        document.getElementById('query-slot').replaceChildren(form);
        const source = sampleMode === 'long' ? longExamples : examples.slice(0, Number(sampleMode));
        const matches = source.filter(item => {
          const value = valuesFor(item, isRequests);
          const words = Object.values(value).join(' ').toLowerCase();
          const date = isRequests ? (item.submitted.startsWith('2026') ? item.submitted : '2026/' + item.submitted) : '2026/11/08 09:30';
          const day = date.slice(0, 10).replaceAll('/', '-');
          return applied.keyword.toLowerCase().split(/\s+/).filter(Boolean).every(word => words.includes(word)) &&
            (applied.status === 'all' || (!isRequests && applied.status === 'effective') || item.status === applied.status) &&
            (!applied.fromDate || day >= applied.fromDate) && (!applied.toDate || day <= applied.toDate);
        });
        const pageCount = matches.length ? Math.ceil(matches.length / applied.pageSize) : 0;
        applied.page = Math.min(Math.max(1, applied.page), Math.max(1, pageCount));
        const empty = text('div', '', 'empty');
        const filtered = applied.keyword || applied.status !== 'all' || applied.fromDate || applied.toDate;
        empty.append(WorkbenchIcon('inbox', 32), text('h3', filtered ? '没有符合条件的示例' : '暂无' + title),
          text('p', filtered ? '调整条件后可重新查看样例。' : '切换示例数据状态，可查看单条或多条记录。'));
        const widths = [null, '128px', '176px', '112px', '224px'];
        const table = RecordTable.render({
          caption: title + '规范样张', minWidth: '880px', bodyId: 'rows', headId: 'headings',
          columns: headings.map((label, index) => ({ key: String(index), label, width: widths[index] })),
          items: matches.slice((applied.page - 1) * applied.pageSize, applied.page * applied.pageSize), empty,
          row(item) {
            const value = valuesFor(item, isRequests);
            return [[clippedText('strong', value.subject, 'cell-title'), clippedText('small', value.description, 'cell-description')],
              clippedText('span', value.person), clippedText('span', value.date, 'cell-date'),
              text('span', value.status, 'status' + (!isRequests ? ' success' : '')), rowActions(item, isRequests)];
          }
        });
        table.addEventListener('scroll', closeActions);
        const pager = RecordControls.pager({ total: matches.length, page: applied.page, pageCount, pageSize: applied.pageSize },
          page => { applied.page = page; render('page'); },
          size => { applied.pageSize = size; applied.page = 1; render('pageSize'); });
        pager.dataset.measure = '共用分页 · 上下 12px · 左右 24px';
        document.getElementById('results-panel').replaceChildren(table, pager);
        if (focusKey) document.querySelector('[data-list-focus="' + focusKey + '"]')?.focus({ preventScroll: true });
      }

      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
        view = button.dataset.view;
        applied = { ...defaults };
        render();
      }));
      document.getElementById('sample-count').addEventListener('change', event => {
        sampleMode = event.target.value;
        applied.page = 1;
        render();
      });
      document.getElementById('measure').addEventListener('click', event => {
        const shown = document.body.classList.toggle('measures');
        event.currentTarget.setAttribute('aria-pressed', String(shown));
      });
      document.getElementById('close-record').addEventListener('click', () => recordDialog.close());
      recordDialog.addEventListener('close', () => {
        if (recordReturnFocus?.isConnected) recordReturnFocus.focus({ preventScroll: true });
      });
      window.addEventListener('resize', closeActions);
      render();
    })();
  </script>
</body>
</html>
