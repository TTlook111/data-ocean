<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataOcean 后台界面规范样张</title>
  <link rel="icon" href="../app/assets/dataocean-mark.png">
  <script src="../app/icons.js"></script>
  <style>
    :root {
      --space-0: 0;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --header-height: 64px;
      --sidebar-width: 216px;
      --control-height: 40px;
      --table-header-height: 48px;
      --table-row-height: 64px;
      --table-footer-height: 64px;
      --table-person-width: 128px;
      --table-date-width: 176px;
      --table-status-width: 112px;
      --table-action-width: 192px;
      --table-min-width: 728px;
      --icon-size: 16px;
      --logo-width: 25px;
      --logo-height: 29px;
      --brand-font-size: 21px;
      --font-small: 12px;
      --line-small: 18px;
      --font-body: 14px;
      --line-body: 22px;
      --line-cell: 24px;
      --font-key: 16px;
      --line-key: 24px;
      --font-title: 24px;
      --line-title: 32px;
      --font-detail: 28px;
      --line-detail: 36px;
      --weight-regular: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --color-primary: #2f63d5;
      --color-primary-hover: #244eaa;
      --color-canvas: #f5f7fa;
      --color-panel: #ffffff;
      --color-border: #e5e7eb;
      --color-text: #1f2937;
      --color-muted: #5b6575;
      --color-selected: #eaf0fc;
      --color-table-head: #fafbfc;
      --color-success: #216449;
      --color-success-bg: #e8f5ee;
      --color-pending: #805610;
      --color-pending-bg: #fcf2dd;
      --color-measure: #b45309;
      --color-measure-bg: #fff7ed;
      --radius-control: 6px;
      --radius-panel: 8px;
      --border-width: 1px;
      --focus-width: 2px;
      --app-height: 100dvh;
      --query-keyword-min: 320px;
      --query-keyword-max: 400px;
      --query-status-min: 160px;
      --query-status-max: 200px;
      --empty-symbol-size: 32px;
      font-family: Inter, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      font-size: var(--font-body);
      line-height: var(--line-body);
      color: var(--color-text);
      background: var(--color-canvas);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: var(--space-0); }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: var(--focus-width) solid var(--color-primary);
      outline-offset: var(--focus-width);
    }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .specimen {
      display: grid;
      grid-template-rows: var(--header-height) minmax(var(--space-0), 1fr);
      height: var(--app-height);
      overflow: hidden;
    }
    .topbar {
      display: flex; align-items: center; gap: var(--space-4);
      padding-inline: var(--space-6);
      border-bottom: var(--border-width) solid var(--color-border);
      background: var(--color-panel);
    }
    .brand { display: flex; align-items: center; gap: var(--space-2); min-width: var(--space-0); }
    .brand img { width: var(--logo-width); height: var(--logo-height); object-fit: contain; }
    .brand strong { font-size: var(--brand-font-size); font-weight: var(--weight-semibold); line-height: var(--line-title); letter-spacing: -.04em; }
    .spec-caption { color: var(--color-muted); padding-inline-start: var(--space-4); border-inline-start: var(--border-width) solid var(--color-border); }
    .top-actions { margin-inline-start: auto; }
    .shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(var(--space-0), 1fr); min-height: var(--space-0); }
    .sidebar { display: flex; flex-direction: column; gap: var(--space-6); min-height: var(--space-0); padding: var(--space-6) var(--space-4); border-inline-end: var(--border-width) solid var(--color-border); background: var(--color-panel); }
    .nav { display: grid; gap: var(--space-1); }
    .nav-heading { margin: var(--space-0) var(--space-3) var(--space-2); font-size: var(--font-small); color: var(--color-muted); font-weight: var(--weight-medium); line-height: var(--line-small); }
    .nav button { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: var(--control-height); padding: var(--space-2) var(--space-3); border: var(--space-0); border-radius: var(--radius-control); background: transparent; text-align: left; }
    .nav button:hover { background: var(--color-canvas); }
    .nav button[aria-current="page"] { background: var(--color-selected); }
    .nav svg { width: var(--icon-size); height: var(--icon-size); flex: none; }
    .sample-controls { display: grid; gap: var(--space-2); margin-top: auto; padding: var(--space-3); border-top: var(--border-width) solid var(--color-border); }
    .sample-controls label { color: var(--color-muted); font-size: var(--font-small); line-height: var(--line-small); }
    .workspace { display: flex; flex-direction: column; gap: var(--space-6); min-width: var(--space-0); min-height: var(--space-0); padding: var(--space-6); position: relative; overflow: hidden; }
    .page-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex: none; }
    h1 { margin: var(--space-0); font-size: var(--font-title); line-height: var(--line-title); font-weight: var(--weight-semibold); }
    .panel { min-width: var(--space-0); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-panel); background: var(--color-panel); }
    .query-panel { padding: var(--space-6); flex: none; position: relative; }
    .query-grid { display: flex; flex-wrap: wrap; align-items: end; gap: var(--space-4); position: relative; }
    .query-grid > .field:first-child { flex: 0 1 var(--query-keyword-max); min-width: min(100%, var(--query-keyword-min)); }
    .query-grid > .field:nth-child(2) { flex: 0 1 var(--query-status-max); min-width: var(--query-status-min); }
    .field { display: grid; gap: var(--space-2); min-width: var(--space-0); position: relative; }
    .field > span { color: var(--color-muted); }
    input, select { min-width: var(--space-0); height: var(--control-height); padding: var(--space-2) var(--space-3); border: var(--border-width) solid #cbd3df; border-radius: var(--radius-control); background: var(--color-panel); line-height: var(--line-body); }
    input::placeholder { color: var(--color-muted); opacity: .85; }
    .actions { display: flex; gap: var(--space-2); align-items: center; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--control-height); padding: var(--space-2) var(--space-4); border: var(--border-width) solid #cbd3df; border-radius: var(--radius-control); background: var(--color-panel); line-height: var(--line-body); white-space: nowrap; }
    .button:hover:enabled { background: var(--color-canvas); }
    .button.primary { border-color: var(--color-primary); background: var(--color-primary); color: var(--color-panel); }
    .button.primary:hover:enabled { border-color: var(--color-primary-hover); background: var(--color-primary-hover); }
    .button[aria-pressed="true"] { border-color: var(--color-primary); background: var(--color-selected); color: var(--color-primary); }
    .button:disabled { color: #8b95a4; background: var(--color-table-head); }
    .button svg { width: var(--icon-size); height: var(--icon-size); }
    .results { display: flex; flex-direction: column; flex: 1; min-height: var(--space-0); overflow: hidden; position: relative; }
    .table-zone { display: flex; flex-direction: column; flex: 1; min-height: var(--space-0); container: records / inline-size; }
    .table-scroll { flex: 1; min-height: var(--space-0); overflow: auto; overscroll-behavior: contain; }
    .table-scroll:has(table[hidden]) { display: flex; flex-direction: column; }
    table { width: 100%; min-width: var(--table-min-width); border-collapse: collapse; table-layout: fixed; }
    caption { position: absolute; width: var(--border-width); height: var(--border-width); overflow: hidden; clip-path: inset(50%); }
    col.person { width: var(--table-person-width); }
    col.date { width: var(--table-date-width); }
    col.state { width: var(--table-status-width); }
    col.command { width: var(--table-action-width); }
    th, td { min-width: var(--space-0); padding: var(--space-3) var(--space-4); text-align: left; line-height: var(--line-cell); vertical-align: middle; overflow: hidden; }
    th:first-child, td:first-child { padding-inline-start: var(--space-6); }
    th:last-child, td:last-child { padding-inline-end: var(--space-6); }
    thead { position: sticky; top: var(--space-0); z-index: 1; background: var(--color-table-head); }
    th { height: var(--table-header-height); font-weight: var(--weight-medium); color: var(--color-muted); border-bottom: var(--border-width) solid var(--color-border); white-space: nowrap; text-overflow: ellipsis; }
    td { height: var(--table-row-height); border-bottom: var(--border-width) solid var(--color-border); }
    tbody tr:last-child td { border-bottom: var(--space-0); }
    tbody tr:hover { background: var(--color-table-head); }
    .cell-text { display: block; min-width: var(--space-0); max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    td strong { font-weight: var(--weight-medium); }
    td small { font-size: var(--font-small); line-height: var(--space-4); color: var(--color-muted); }
    .status { display: inline-block; padding: var(--space-0) var(--space-2); border-radius: var(--space-1); background: var(--color-pending-bg); color: var(--color-pending); font-size: var(--font-small); line-height: var(--line-cell); font-weight: var(--weight-medium); white-space: nowrap; }
    .status.success { color: var(--color-success); background: var(--color-success-bg); }
    .text-action { display: block; max-width: 100%; min-height: var(--control-height); padding: var(--space-0); border: var(--space-0); background: transparent; color: var(--color-primary); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .text-action svg { width: var(--icon-size); height: var(--icon-size); }
    .row-actions { display: flex; align-items: center; flex-wrap: nowrap; gap: var(--space-2); min-width: var(--space-0); }
    .row-actions .text-action { flex: none; }
    .row-actions .more-actions { display: inline-flex; align-items: center; gap: var(--space-1); }
    .row-menu { position: fixed; inset: auto; width: min(224px, calc(100vw - var(--space-8))); max-height: calc(100dvh - var(--space-8)); margin: var(--space-0); padding: var(--space-1); overflow-y: auto; border: var(--border-width) solid var(--color-border); border-radius: var(--radius-control); background: var(--color-panel); color: var(--color-text); box-shadow: 0 4px 16px #1f29371a; }
    .row-menu:popover-open { display: grid; gap: var(--space-1); }
    .row-menu button { width: 100%; min-height: var(--control-height); padding: var(--space-2) var(--space-3); border: var(--space-0); border-radius: var(--space-1); background: transparent; text-align: left; }
    .row-menu button:hover { background: var(--color-canvas); }
    .row-menu button:focus-visible { outline-offset: calc(var(--focus-width) * -1); }
    .action-feedback { position: fixed; inset: auto var(--space-6) var(--space-6) auto; max-width: calc(100vw - var(--space-8)); margin: var(--space-0); padding: var(--space-2) var(--space-3); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-control); background: var(--color-panel); color: var(--color-text); box-shadow: 0 4px 16px #1f29371a; }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); flex: 1; padding: var(--space-6); text-align: center; }
    .empty svg { width: var(--empty-symbol-size); height: var(--empty-symbol-size); margin-bottom: var(--space-2); color: var(--color-muted); }
    .empty h3 { margin: var(--space-0); font-size: var(--font-key); line-height: var(--line-key); font-weight: var(--weight-semibold); }
    .empty p { margin: var(--space-0); color: var(--color-muted); }
    .result-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); height: var(--table-footer-height); flex: none; padding: var(--space-3) var(--space-6); border-top: var(--space-0); box-shadow: inset var(--space-0) var(--border-width) var(--color-border); position: relative; }
    .result-footer > span { color: var(--color-muted); }
    .pagination { display: flex; align-items: center; gap: var(--space-2); }
    .page-index { padding-inline: var(--space-2); font-variant-numeric: tabular-nums; }
    .spec-note { margin: var(--space-0); font-size: var(--font-small); line-height: var(--line-small); color: var(--color-muted); }
    [data-measure]::before { display: none; }
    .measures [data-measure] { outline: var(--border-width) dashed var(--color-measure); outline-offset: calc(var(--border-width) * -1); }
    .measures [data-measure]::before { display: block; content: attr(data-measure); position: absolute; top: calc(var(--space-3) * -1); left: var(--space-3); z-index: 3; padding: var(--space-0) var(--space-1); border: var(--border-width) solid #fed7aa; border-radius: var(--space-1); background: var(--color-measure-bg); color: var(--color-measure); font-size: var(--font-small); line-height: var(--line-small); white-space: nowrap; pointer-events: none; }
    .measures .workspace::before { top: var(--space-1); left: var(--space-1); }
    .measures .result-footer::before { top: calc(var(--space-3) * -1); }
    .measures .results[data-measure]::before { top: var(--space-1); left: var(--space-6); }
    .record-dialog { width: min(720px, calc(100% - var(--space-8))); max-height: calc(100dvh - var(--space-12)); padding: var(--space-0); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-panel); color: var(--color-text); background: var(--color-panel); }
    .record-dialog[open] { display: flex; flex-direction: column; }
    .record-dialog::backdrop { background: #1f293754; }
    .record-dialog header { display: flex; flex: none; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) var(--space-6); border-bottom: var(--border-width) solid var(--color-border); }
    .record-dialog h2 { margin: var(--space-0); font-size: var(--font-key); line-height: var(--line-key); font-weight: var(--weight-semibold); }
    .record-dialog .close-record { width: var(--control-height); padding-inline: var(--space-0); }
    .record-body { min-height: var(--space-0); overflow-y: auto; overscroll-behavior: contain; padding: var(--space-6); }
    .record-body dl, .record-body dd { margin: var(--space-0); }
    .record-field + .record-field { margin-top: var(--space-4); }
    .record-field dt { margin-bottom: var(--space-2); color: var(--color-muted); }
    .record-field dd { white-space: pre-wrap; overflow-wrap: anywhere; }
    body:has(.record-dialog[open]) { overflow: hidden; }
    @media (forced-colors: active) {
      .nav button[aria-current="page"], .button[aria-pressed="true"] { outline: var(--border-width) solid Highlight; }
    }
  </style>
</head>
<body>
  <div class="specimen">
    <header class="topbar">
      <div class="brand"><img src="../app/assets/dataocean-mark.png" alt=""><strong>DataOcean</strong><span class="spec-caption"><span class="desktop-context">静态</span>规范样张</span></div>
      <div class="top-actions"><button id="measure" type="button" class="button" aria-pressed="false">间距标注</button></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <nav class="nav" aria-label="规范样张菜单">
          <h2 class="nav-heading">权限管理</h2>
          <button type="button" data-view="requests" aria-current="page"><span data-icon="inbox"></span>访问申请</button>
          <button type="button" data-view="grants"><span data-icon="layers"></span>授权记录</button>
        </nav>
        <div class="sample-controls"><label for="sample-count">示例数据状态</label><select id="sample-count" aria-label="示例数据数量"><option value="0">0 条 · 空状态</option><option value="1">1 条 · 少量记录</option><option value="10" selected>10 条 · 表体滚动</option><option value="long">超长内容 · 全列检查</option></select><p class="spec-note">仅用于核对布局和间距。</p></div>
      </aside>
      <main class="workspace" data-measure="工作区四边 24px · 区块间距 24px">
        <div class="page-heading"><h1 id="page-title">访问申请</h1></div>
        <form class="panel query-panel" id="query" data-measure="面板四边内距 24px">
          <div class="query-grid" data-measure="字段组间距 16px">
            <label class="field"><span class="sr-only">关键词</span><input id="keyword" type="search" placeholder="申请编号、申请人或业务用途" maxlength="100"></label>
            <label class="field"><span class="sr-only">状态</span><select id="status"><option value="all">全部状态</option><option value="pending">待审批</option><option value="approved">待执行</option></select></label>
            <div class="actions"><button class="button primary" type="submit">查询</button><button class="button" id="reset" type="button">重置</button></div>
          </div>
        </form>
        <section class="panel results" id="results-panel" aria-label="访问申请查询结果" data-measure="同一结果面板 · 表头、内容与分页">
          <div class="table-zone">
            <div class="table-scroll">
              <table><caption>静态规范样张的示例数据</caption><colgroup><col class="subject"><col class="person"><col class="date"><col class="state"><col class="command"></colgroup><thead><tr id="headings"></tr></thead><tbody id="rows"></tbody></table>
              <div class="empty" id="empty" hidden><span data-icon="inbox"></span><h3 id="empty-title">暂无访问申请</h3><p id="empty-copy">示例数据为空。</p></div>
            </div>
          </div>
          <footer class="result-footer" data-measure="分页高 64px · 上下 12px · 左右 24px"><span id="range" role="status">共 10 条</span><div class="pagination"><select id="page-size" aria-label="样张每页条数"><option value="10">10 条 / 页</option><option value="20">20 条 / 页</option><option value="50">50 条 / 页</option></select><button class="button" id="previous" type="button" disabled>上一页</button><span class="page-index" id="page-index">1 / 1</span><button class="button" id="next" type="button" disabled>下一页</button></div></footer>
        </section>
      </main>
    </div>
  </div>
  <dialog id="record-dialog" class="record-dialog" aria-labelledby="record-dialog-title">
    <header><h2 id="record-dialog-title">记录完整内容</h2><button id="close-record" class="button close-record" type="button" aria-label="关闭记录详情"><span data-icon="x"></span></button></header>
    <div class="record-body"><dl id="record-fields"></dl></div>
  </dialog>
  <div id="record-actions" class="row-menu" popover="auto" aria-label="更多记录操作">
    <button id="copy-description" type="button">复制用途</button>
    <button id="copy-person" type="button">复制申请人</button>
  </div>
  <div id="action-feedback" class="action-feedback" popover="manual" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const examples = [
        { id: 'SQ-001', person: '周店长', purpose: '核对上周门店经营周报', submitted: '11/08 09:30', status: 'pending' },
        { id: 'SQ-002', person: '李店长', purpose: '准备上周毛利分析', submitted: '11/08 09:15', status: 'approved' },
        { id: 'SQ-003', person: '王店长', purpose: '核对上周销售成本', submitted: '11/08 09:00', status: 'pending' },
        { id: 'SQ-004', person: '陈店长', purpose: '复核上周经营数据', submitted: '11/07 16:45', status: 'pending' },
        { id: 'SQ-005', person: '赵店长', purpose: '核对门店经营周报', submitted: '11/07 16:30', status: 'approved' },
        { id: 'SQ-006', person: '杨店长', purpose: '复盘上周门店毛利', submitted: '11/07 16:15', status: 'pending' },
        { id: 'SQ-007', person: '刘店长', purpose: '准备月度经营复盘', submitted: '11/07 16:00', status: 'approved' },
        { id: 'SQ-008', person: '黄店长', purpose: '核对同期成本归属', submitted: '11/07 15:45', status: 'pending' },
        { id: 'SQ-009', person: '吴店长', purpose: '核验上周毛利额', submitted: '11/07 15:30', status: 'pending' },
        { id: 'SQ-010', person: '徐店长', purpose: '准备经营例会数据', submitted: '11/07 15:15', status: 'approved' }
      ];
      const longExamples = [
        {
          id: 'SQ-20261108-' + 'DATAOCEAN-REVIEW-'.repeat(8) + '编号末尾',
          title: '城南片区直营门店上周经营复盘及跨周退货归属核对的毛利汇总访问申请',
          person: '城南片区直营事业部经营分析组负责人周店长',
          purpose: ('用于核对上周各门店经营周报、跨周退货以及销售成本归属，形成经营例会所需的毛利说明。\n').repeat(8) + '原因完整末尾',
          scope: '华东零售事业部城南片区直营门店经营汇总及获准计算依据的适用业务范围',
          resource: '门店毛利汇总与经营分析所需销售净额和成本依据的只读权限',
          submitted: '2026/11/08 09:30', status: 'pending'
        },
        {
          id: 'SQ-' + 'LONGUNBROKENIDENTIFIER'.repeat(7) + '-END',
          title: 'MONTHLYBUSINESSPERFORMANCEREVIEW'.repeat(8) + 'TITLE-END',
          person: 'RegionalBusinessOperationsAnalysisManager'.repeat(3) + '-PERSON-END',
          purpose: '连续英文与符号样例 [A+B] <记录>\n' + 'COSTANDRETURNSANALYSISEVIDENCE'.repeat(16) + 'PURPOSE-END',
          scope: 'AUTHORIZEDBUSINESSRESOURCESCOPE'.repeat(7) + '-SCOPE-END',
          resource: 'GROSSPROFITANDCALCULATIONBASIS'.repeat(5) + '-RESOURCE-END',
          submitted: '2026/11/08 09:15', status: 'approved'
        }
      ];
      let view = 'requests';
      let sampleMode = '10';
      let applied = { keyword: '', status: 'all' };
      const keyword = document.getElementById('keyword');
      const status = document.getElementById('status');
      const rows = document.getElementById('rows');
      const empty = document.getElementById('empty');
      const recordDialog = document.getElementById('record-dialog');
      const recordFields = document.getElementById('record-fields');
      const actionMenu = document.getElementById('record-actions');
      const feedback = document.getElementById('action-feedback');
      let activeOperation;
      let menuTrigger;
      let feedbackTimer;
      for (const slot of document.querySelectorAll('[data-icon]')) slot.replaceWith(WorkbenchIcon(slot.dataset.icon));

      function text(tag, content, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = content;
        return node;
      }

      function valuesFor(item, isRequests) {
        return {
          subject: isRequests ? item.title || '城南店毛利汇总访问申请' : item.resource || '仅毛利额',
          description: isRequests ? item.purpose : (item.scope || '城南店经营汇总') + ' · 14 天',
          person: item.person,
          date: isRequests ? item.submitted : '2026/11/22 09:30',
          status: isRequests ? (item.status === 'pending' ? '待审批' : '待执行') : '已生效',
          id: item.id
        };
      }

      function clippedText(tag, value, className = '') {
        const node = text(tag, value, 'cell-text ' + className);
        node.title = value;
        return node;
      }

      function showRecord(item, isRequests) {
        closeActions();
        const value = valuesFor(item, isRequests);
        const fields = [
          [isRequests ? '申请事项' : '获准范围', value.subject],
          [isRequests ? '业务用途' : '适用范围', value.description],
          ['申请人', value.person],
          [isRequests ? '提交时间' : '有效至', value.date],
          ['状态', value.status],
          [isRequests ? '申请编号' : '来源申请', value.id]
        ];
        recordFields.replaceChildren();
        for (const [label, content] of fields) {
          const field = text('div', '', 'record-field');
          field.append(text('dt', label), text('dd', content));
          recordFields.append(field);
        }
        recordDialog.showModal();
      }

      function notify(message) {
        clearTimeout(feedbackTimer);
        feedback.textContent = message;
        if (!feedback.matches(':popover-open')) feedback.showPopover();
        feedbackTimer = setTimeout(() => feedback.hidePopover(), 3500);
      }

      function closeActions() {
        if (actionMenu.matches(':popover-open')) actionMenu.hidePopover();
      }

      async function copyValue(value, label, item, isRequests) {
        closeActions();
        try {
          await navigator.clipboard.writeText(value);
          notify('已复制' + label);
        } catch {
          showRecord(item, isRequests);
          notify('复制未完成，可在详情中选择文字复制。');
        }
      }

      function openActions(trigger, item, isRequests) {
        if (actionMenu.matches(':popover-open') && menuTrigger === trigger) {
          closeActions();
          return;
        }
        closeActions();
        menuTrigger = trigger;
        activeOperation = { item, isRequests };
        document.getElementById('copy-description').textContent = isRequests ? '复制用途' : '复制适用范围';
        actionMenu.showPopover();
        const target = trigger.getBoundingClientRect();
        const width = actionMenu.offsetWidth;
        const height = actionMenu.offsetHeight;
        const gap = 8;
        const edge = 16;
        const left = Math.max(edge, Math.min(target.right - width, innerWidth - width - edge));
        const below = target.bottom + gap;
        const top = below + height <= innerHeight - edge ? below : Math.max(edge, target.top - height - gap);
        actionMenu.style.left = left + 'px';
        actionMenu.style.top = top + 'px';
        trigger.setAttribute('aria-expanded', 'true');
        actionMenu.querySelector('button').focus({ preventScroll: true });
      }

      function rowActions(item, isRequests) {
        const controls = text('div', '', 'row-actions');
        const viewButton = text('button', '查看', 'text-action');
        viewButton.type = 'button';
        viewButton.dataset.rowAction = 'view';
        viewButton.setAttribute('aria-label', '查看记录全文 ' + item.id);
        viewButton.addEventListener('click', () => showRecord(item, isRequests));
        const copyButton = text('button', '复制编号', 'text-action');
        copyButton.type = 'button';
        copyButton.dataset.rowAction = 'copy-id';
        copyButton.addEventListener('click', () => copyValue(item.id, '编号', item, isRequests));
        const moreButton = text('button', '更多', 'text-action more-actions');
        moreButton.type = 'button';
        moreButton.dataset.rowAction = 'more';
        moreButton.setAttribute('aria-label', '更多记录操作 ' + item.id);
        moreButton.setAttribute('aria-controls', actionMenu.id);
        moreButton.setAttribute('aria-expanded', 'false');
        moreButton.append(WorkbenchIcon('chevron-down', 14));
        moreButton.addEventListener('click', () => openActions(moreButton, item, isRequests));
        controls.append(viewButton, copyButton, moreButton);
        return controls;
      }

      function render() {
        closeActions();
        const isRequests = view === 'requests';
        const title = isRequests ? '访问申请' : '授权记录';
        document.getElementById('page-title').textContent = title;
        document.getElementById('results-panel').setAttribute('aria-label', title + '查询结果');
        document.querySelectorAll('[data-view]').forEach(button => {
          if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        const headings = isRequests ? ['申请事项', '申请人', '提交时间', '状态', '操作'] : ['获准范围', '申请人', '有效至', '状态', '操作'];
        const head = document.getElementById('headings');
        head.replaceChildren(...headings.map(label => {
          const th = text('th', label); th.scope = 'col'; th.title = label; return th;
        }));
        const source = sampleMode === 'long' ? longExamples : examples.slice(0, Number(sampleMode));
        const matches = source.filter(item => {
          const value = valuesFor(item, isRequests);
          const words = Object.values(value).join(' ').toLowerCase();
          return words.includes(applied.keyword.toLowerCase()) &&
            (applied.status === 'all' || (!isRequests && applied.status === 'effective') || item.status === applied.status);
        });
        rows.replaceChildren();
        for (const item of matches) {
          const value = valuesFor(item, isRequests);
          const row = document.createElement('tr');
          const subject = document.createElement('td');
          subject.append(clippedText('strong', value.subject, 'cell-title'), clippedText('small', value.description, 'cell-description'));
          const person = document.createElement('td');
          person.append(clippedText('span', value.person));
          person.dataset.label = '申请人';
          const submitted = document.createElement('td');
          submitted.append(clippedText('span', value.date, 'cell-date'));
          submitted.dataset.field = 'submitted';
          submitted.dataset.label = isRequests ? '提交时间' : '有效至';
          const state = document.createElement('td');
          state.dataset.field = 'status';
          state.dataset.label = '状态';
          state.append(text('span', value.status, 'status' + (!isRequests ? ' success' : '')));
          const command = document.createElement('td');
          command.dataset.field = 'action';
          command.dataset.label = '操作';
          command.append(rowActions(item, isRequests));
          row.append(subject, person, submitted, state, command);
          rows.append(row);
        }
        empty.hidden = matches.length > 0;
        document.querySelector('table').hidden = matches.length === 0;
        document.getElementById('empty-title').textContent = applied.keyword || applied.status !== 'all' ? '没有符合条件的示例' : '暂无' + title;
        document.getElementById('empty-copy').textContent = applied.keyword || applied.status !== 'all' ? '调整条件后可重新查看样例。' : '切换示例数据状态，可查看单条或多条记录。';
        document.getElementById('range').textContent = '共 ' + matches.length + ' 条';
        document.getElementById('page-index').textContent = matches.length ? '1 / 1' : '0 / 0';
        document.querySelector('.pagination').hidden = matches.length === 0;
      }

      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
        view = button.dataset.view;
        applied = { keyword: '', status: 'all' };
        keyword.value = '';
        status.replaceChildren(new Option('全部状态', 'all'), ...(view === 'requests'
          ? [new Option('待审批', 'pending'), new Option('待执行', 'approved')]
          : [new Option('已生效', 'effective')]));
        render();
      }));
      document.getElementById('sample-count').addEventListener('change', event => {
        sampleMode = event.target.value;
        render();
      });
      document.getElementById('query').addEventListener('submit', event => {
        event.preventDefault();
        applied = { keyword: keyword.value.trim(), status: status.value };
        render();
      });
      document.getElementById('reset').addEventListener('click', () => {
        keyword.value = ''; status.value = 'all'; applied = { keyword: '', status: 'all' }; render();
      });
      document.getElementById('measure').addEventListener('click', event => {
        const shown = document.body.classList.toggle('measures');
        event.currentTarget.setAttribute('aria-pressed', String(shown));
      });
      document.getElementById('close-record').addEventListener('click', () => recordDialog.close());
      document.getElementById('copy-description').addEventListener('click', () => {
        if (!activeOperation) return;
        const { item, isRequests } = activeOperation;
        const value = valuesFor(item, isRequests);
        copyValue(value.description, isRequests ? '用途' : '适用范围', item, isRequests);
      });
      document.getElementById('copy-person').addEventListener('click', () => {
        if (!activeOperation) return;
        const { item, isRequests } = activeOperation;
        copyValue(item.person, '申请人', item, isRequests);
      });
      actionMenu.addEventListener('toggle', () => {
        if (!menuTrigger) return;
        const open = actionMenu.matches(':popover-open');
        menuTrigger.setAttribute('aria-expanded', String(open));
        if (!open && actionMenu.contains(document.activeElement)) menuTrigger.focus({ preventScroll: true });
      });
      actionMenu.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeActions();
          menuTrigger?.focus({ preventScroll: true });
        }
      });
      document.querySelector('.table-scroll').addEventListener('scroll', closeActions);
      window.addEventListener('resize', closeActions);
      render();
    })();
  </script>
</body>
</html>
