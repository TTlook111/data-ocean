<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataOcean 原型</title>
  <script>
    // 保留原型深链；默认从登录名与密码登录页开始评审。
    const flowViews = ['#overview', '#knowledge', '#query', '#access'];
    const designs = ['#1', '#2', '#3'];
    const entry = flowViews.includes(location.hash) ? '项目运行图.html'
      : designs.includes(location.hash) ? 'visual-directions/index.html' : location.hash ? 'app/index.html' : 'app/login.html';
    const target = new URL(entry, location.href);
    target.search = location.search;
    if (entry === 'app/index.html') target.searchParams.set('prototype', 'element-controls-20261108-r3');
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</head>
<body><a href="app/login.html">登录</a> · <a href="app/index.html">问数工作台</a> · <a href="后台管理/index.html">后台管理</a> · <a href="visual-directions/index.html">视觉选稿</a> · <a href="项目运行图.html">项目运行图</a></body>
</html>
