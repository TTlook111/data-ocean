[project]
name = "dataocean-ai"
version = "0.1.0"
description = "DataOcean Python AI service"
requires-python = ">=3.13,<3.15"
dependencies = [
    "anthropic==2.10.0",
    "fastapi==0.163.1",
    "uvicorn[standard]>=0.32,<1",
    "langgraph==1.2.22",
    "langgraph-checkpoint==4.3.2",
    "langgraph-checkpoint-redis==0.6.0",
    "pymilvus==2.6.17",
    "httpx>=0.28,<1",
    "httpx2==2.3.0",
    "PyJWT[crypto]>=2.10,<3",
    "redis==8.1.0",
    "langchain-openai==1.8.3",
    "langchain-anthropic==1.7.11",
    "langsmith>=0.15,<0.16",
]

[project.scripts]
dataocean-ai-api = "dataocean_ai.api.app:main"
dataocean-ai-worker = "dataocean_ai.governance.worker:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--confcutdir=tests/unit"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
