[project]
name = "dataocean-technical-validation"
version = "0.0.1"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.163.1",
    "langgraph==1.2.22",
    "langgraph-checkpoint==4.3.2",
    "langgraph-checkpoint-redis==0.6.0",
    "pymilvus==2.6.17",
    "PyMySQL>=1.1",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "PyJWT[crypto]>=2.10",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
