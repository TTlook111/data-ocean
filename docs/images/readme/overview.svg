    <g font-size="12" font-weight="600" letter-spacing="1.6" fill="#7dd3fc">
      <text x="62" y="98">01 / GOVERN</text>
      <text x="452" y="98">02 / RETRIEVE</text>
      <text x="842" y="98">03 / ASK</text>
    </g>
    <g font-size="24" font-weight="600" fill="#f0f9ff">
      <text x="62" y="132">Governed metadata</text>
      <text x="452" y="132">Schema RAG</text>
