function data(){if(state==='empty')return [];const selected=source==='5'?[raw[0],raw[2],raw[8]]:snapshot==='30'?raw.slice(5,10):raw;return selected.map(r=>({id:r[0]+(source==='5'?400:snapshot==='30'?200:0),tableName:source==='5'?`catalog_${r[1]}`:r[1],columnName:r[2],issueDomain:r[3],severity:r[4],status:r[5],description:r[6],dimension:r[7]}))}
function issuesReadable(){return !['failed','issue-denied','forbidden'].includes(state)&&!loading}
function visibleData(){const all=data();return state==='incomplete'?all.slice(0,5):all}
function filtered(){return visibleData().filter(x=>(!domain||x.issueDomain===domain)&&(!status||x.status===status)&&(!table||x.tableName===table))}
function countRows(rows,key,value){return rows.filter(x=>x[key]===value).length}
function renderNav(){let html='';for(const d of domains){const active=d[0]==='数据治理';html+=`<a href="#" class="navlink ${active?'active':''}" data-go="${d[1]}" data-title="${d[0]}">${icon(d[2])}<span>${d[0]}</span></a>`;if(active){let last='';html+='<div class="subnav" aria-label="数据治理工作区">';for(const g of groups['数据治理']){if(g[0]!==last){last=g[0];html+=`<small>${g[0]}</small>`}html+=`<a href="#" ${g[1]==='治理总览'?'class="current" aria-current="page"':''} data-go="${g[2]}" data-title="${g[1]}">${g[1]}</a>`}html+='</div>'}}document.getElementById('nav').innerHTML=html}
function snapshotOptions(){document.getElementById('snapshot').innerHTML=snapshots[source].map(x=>`<option value="${x.id}" ${String(x.id)===snapshot?'selected':''}>${x.label}</option>`).join('')}
function headline(rows,read){return `<div class="headline"><div class="bigstat"><strong>${read?rows.length:'—'}</strong><span>条未解决问题</span></div><div class="bigstat"><strong>${read&&state!=='incomplete'?new Set(rows.map(x=>x.tableName)).size:'—'}</strong><span>个涉及表</span></div><span class="headline-note">当前快照 · OPEN / CONFIRMED / REOPENED · 不含已关闭问题</span></div>`}
function problemChart(rows,read){const n=rows.length,sourceCount=countRows(rows,'issueDomain','SOURCE'),semanticCount=countRows(rows,'issueDomain','SEMANTIC');return `<figure class="chartpane" aria-labelledby="domain-title"><figcaption class="charttop"><h2 id="domain-title">问题画像</h2><span>${read?`${n} 条 · 同一快照总量`:'数量不可用'}</span></figcaption>${!read?`<div class="empty inline ${state==='issue-denied'?'noaccess':'error'}"><strong>${state==='issue-denied'?'没有问题查看权限':'问题统计读取失败'}</strong>${state==='issue-denied'?'需要当前来源的 governance:issue:view；不显示为零。':'当前数量未知，恢复读取前不显示空分布。'}</div>`:!n?'<div class="empty inline"><strong>当前未解决问题为0</strong>只代表已读取范围没有未解决问题，不代表校验完整通过。</div>':`<div class="profileplot"><svg class="profile-donut" viewBox="0 0 128 128" role="img" aria-labelledby="profile-title"><title id="profile-title">共${n}条未解决问题，来源${sourceCount}条，语义${semanticCount}条</title><circle cx="64" cy="64" r="45" fill="none" stroke="#5c7363" stroke-width="14"/><circle cx="64" cy="64" r="45" fill="none" stroke="#aa5939" stroke-width="14" stroke-dasharray="${sourceCount/n*282.743} 282.743" transform="rotate(-90 64 64)"/><text class="total" x="64" y="65" text-anchor="middle">${n}</text><text class="label" x="64" y="84" text-anchor="middle">未解决问题</text></svg><div class="domain-controls" role="group" aria-label="按问题域筛选明细">${Object.entries(domainNames).map(([key,name])=>{const v=countRows(rows,'issueDomain',key);return `<button class="segment ${key==='SOURCE'?'source':'semantic'} ${domain===key?'selected':''}" data-domain="${key}" aria-pressed="${domain===key}" aria-label="${name} ${v} 条，筛选明细"><span><i aria-hidden="true"></i>${name}</span><b>${v}</b></button>`}).join('')}</div></div><p class="chartnote">来源问题与语义问题分开处理；选择图形旁的分类或下方状态筛明细。</p><div class="states" role="group" aria-label="按处理状态筛选明细">${Object.entries(statusNames).map(([key,name])=>{const v=countRows(rows,'status',key);return `<button class="statebtn ${key==='REOPENED'?'reopened':''} ${status===key?'selected':''}" data-status="${key}" aria-pressed="${status===key}" aria-label="${name} ${v} 条，筛选明细"><span>${name}<b>${v}</b></span><i class="mini" aria-hidden="true"><i style="width:${v/n*100}%"></i></i></button>`}).join('')}</div>`}</figure>`}
function rankChart(rows,read){const totals={};for(const r of rows)totals[r.tableName]=(totals[r.tableName]||0)+1;const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));const max=Math.max(2,Math.ceil(Math.max(0,...Object.values(totals))/2)*2);return `<figure class="chartpane" aria-labelledby="ranking-title"><figcaption class="charttop"><h2 id="ranking-title">问题集中在哪些表</h2><span>单位：问题条数</span></figcaption>${!read?'<div class="empty inline">明细不可读取，不生成总体排行。</div>':state==='incomplete'?'<div class="empty inline"><strong>明细尚未读取完整</strong>保留权威汇总，暂不计算总体排行；不拿一页记录代表全体。</div>':!rows.length?'<div class="empty inline">当前没有可排行的未解决问题。</div>':`<div class="ranking" role="group" aria-label="按涉及表筛选明细">${sorted.map(([name,n])=>`<button class="rankrow ${table===name?'selected':''}" data-table="${name}" aria-pressed="${table===name}" aria-label="${name} ${n} 条问题，筛选明细"><span class="name">${name}</span><span class="ranktrack" aria-hidden="true"><i style="width:${n/max*100}%"></i></span><b>${n}</b></button>`).join('')}</div><div class="axis" aria-hidden="true"><span></span><div><span>0</span><span>${max/2}</span><span>${max} 条</span></div><span></span></div><p class="chartnote" style="margin:9px 0 0">完整读取 ${rows.length} 条后按表聚合；同一字段可对应多条问题。</p>`}</figure>`}
function batchBand(){if(state==='batch-denied')return '<section class="coverage" aria-label="来源校验"><span class="batchtitle">来源校验覆盖不可读取</span><span class="batchmeta">缺 governance:view，不按未执行或0处理。</span></section>';if(['empty','no-batch'].includes(state))return '<section class="coverage" aria-label="来源校验"><span class="batchtitle">尚无可核验的校验批次</span><span class="batchmeta">不表示历史从未检查，也不补造覆盖率。</span></section>';return `<section class="coverage" aria-label="来源校验覆盖"><span class="batchtitle">${icon('circle-alert')}最近来源校验 <span class="tag warn">部分完成</span></span><div class="rulecounts"><span><b>5</b>执行成功</span><span><b>1</b>失败</span><span><b>1</b>不适用</span><span><b>1</b>未执行</span></div><span class="batchmeta">全量请求 · 8条规则</span><button class="plain" data-batch>查看覆盖依据 ${icon('arrow-up-right')}</button><span class="batchfoot">PARTIAL · complete=false；不生成本次完整评分。执行成功不等于质量无问题。</span></section>`}
function filterChips(){const a=[];if(domain)a.push(['domain',domainNames[domain]]);if(status)a.push(['status',statusNames[status]]);if(table)a.push(['table',table]);return `<div class="activefilters"><span>${a.length?'当前筛选':'概览范围：当前快照全部未解决问题'}</span>${a.map(([key,value])=>`<button class="filterchip" data-clear="${key}" aria-label="清除${esc(value)}筛选">${esc(value)}</button>`).join('')}${a.length?'<button class="plain" data-reset>清除全部</button>':''}</div>`}
function issuePanel(rows,read){const f=read?filtered():[],total=f.length;const pages=Math.max(1,Math.ceil(total/pageSize));page=Math.min(page,pages);const shown=f.slice((page-1)*pageSize,page*pageSize);return `<section class="issuepanel" aria-labelledby="detail-title"><header class="issuehead"><div><h2 id="detail-title" tabindex="-1">问题明细</h2><p aria-live="polite">${!read?'明细不可用':state==='incomplete'?`仅已载入 ${visibleData().length}/${rows.length} 条；当前筛选匹配已载入 ${total} 条`:`当前筛选 ${total} 条 / 快照全部 ${rows.length} 条`}</p></div><div class="right"><span>点击图形筛选，点击行入口查看完整内容</span><button class="plain" data-reset>重置选择</button></div></header>${read?filterChips():''}${!read?`<div class="empty ${state==='issue-denied'?'noaccess':'error'}">${state==='issue-denied'?'没有当前范围的问题查看权限；未请求或显示明细。':'明细读取失败，不能按空列表处理。'}</div>`:!total?'<div class="empty"><strong>当前筛选没有未解决问题</strong>可清除筛选，或到问题中心核对其他状态。</div>':`<div class="table-wrap"><table><colgroup><col style="width:22%"><col style="width:12%"><col style="width:8%"><col style="width:36%"><col style="width:13%"><col style="width:9%"></colgroup><thead><tr><th scope="col">涉及对象</th><th scope="col">问题域</th><th scope="col">风险</th><th scope="col">问题说明</th><th scope="col">状态</th><th scope="col">明细</th></tr></thead><tbody>${shown.map(r=>`<tr><td><strong title="${r.tableName}.${r.columnName}">${r.tableName}.${r.columnName}</strong><small>问题 #${r.id}</small></td><td><span class="tag ${r.issueDomain==='SOURCE'?'source':'semantic'}">${domainNames[r.issueDomain]}</span></td><td><span class="sev ${r.severity}">${sevNames[r.severity]}</span></td><td><span class="desc" title="${r.description}">${r.description}</span></td><td>${statusNames[r.status]}</td><td><button class="plain" data-issue="${r.id}" aria-label="查看问题${r.id}完整详情">查看 ${icon('arrow-up-right')}</button></td></tr>`).join('')}</tbody></table></div>`}<footer class="pager"><span>${read?(state==='incomplete'?'仅本次已加载记录':'完整问题集内分页'):'不展示未知数量'} · 每页${pageSize}条</span><div class="pager-controls"><button data-page="-1" ${page<=1||!read?'disabled':''}>上一页</button><span>${read?`${page} / ${pages}`:'—'}</span><button data-page="1" ${page>=pages||!read?'disabled':''}>下一页</button></div></footer></section>`}
function render(){const root=document.getElementById('content');const read=issuesReadable();document.getElementById('issue-entry').disabled=!read;document.getElementById('field-entry').disabled=state==='forbidden'||loading;if(loading){root.innerHTML='<div class="loading" role="status">正在切换演示范围，旧对象与选择已清除…</div>';return}if(state==='forbidden'){root.innerHTML=`<section class="forbidden" role="alert">${icon('shield-check')}<h2>当前来源没有治理总览查看权限</h2><p>需要当前来源的 governance:view。当前无权状态不显示为零，也不展示旧范围记录。</p></section>`;return}const rows=data();root.innerHTML=headline(rows,read)+(state==='failed'?'<div class="banner error" role="alert"><span>问题统计与明细读取失败，图形数量保持未知；独立校验批次仍可查看。</span><button class="secondary" data-retry>重新读取示例</button></div>':state==='incomplete'?`<div class="banner" role="status"><span>摘要已读取 ${rows.length} 条，分页明细仅载入 ${Math.min(5,rows.length)} 条；总体排行暂不可用。</span><button class="secondary" data-retry>补齐演示明细</button></div>`:'')+`<div class="analysis"><div class="charts">${problemChart(rows,read)}${rankChart(rows,read)}</div>${batchBand()}${issuePanel(rows,read)}</div>`}
const dialog=document.getElementById('detail');function closeDialog(){if(dialog.open)dialog.close()}
function show(title,html){if(!dialog.open)trigger=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;if(!dialog.open)dialog.showModal()}
function showRoute(name,path){if(path==='/admin/governance')return;const scopePath=path.includes('?')?path:path+(['工作台','数据接入','权限与组织','运营与平台'].includes(name)?'':'?'+ctx());let html=`<p>样稿只预览正式工作区的去向，不调用接口或执行业务动作。</p><div class="route">${esc(scopePath)}</div>`;if(groups[name])html+=`<div class="navpaths">${groups[name].map(g=>`<a href="#" data-go="${g[2]}" data-title="${g[1]}" aria-label="${g[1]}"><small>${g[0]}</small>${g[1]}</a>`).join('')}</div>`;show(name,html)}
function showIssue(id){if(!issuesReadable())return;const r=visibleData().find(x=>x.id===id);if(!r)return;show(`问题 #${r.id} · ${r.tableName}.${r.columnName}`,`<dl><dt>当前范围</dt><dd>数据源 #${source} / 快照 #${snapshot}</dd><dt>问题域</dt><dd>${domainNames[r.issueDomain]} · ${r.issueDomain}</dd><dt>处理状态</dt><dd>${statusNames[r.status]} · ${r.status}</dd><dt>问题说明</dt><dd>${esc(r.description)}</dd><dt>涉及对象</dt><dd>${r.tableName}.${r.columnName}</dd></dl><p>这里只读展示演示记录；不关闭问题、不提交审核，不据问题状态推断解释已有效或RAG已收录。</p><button class="secondary" data-go="/admin/governance/issues?${ctx()}" data-title="问题中心">在问题中心继续</button>`)}
function showBatch(){if(['batch-denied','empty','no-batch','forbidden'].includes(state)||loading)return;show('来源校验覆盖依据',`<p>演示批次 #${Number(snapshot)+770} · 来源 #${source} · 快照 #${snapshot} · FULL / PARTIAL / complete=false。8条规则，不是8个字段。</p><div class="rulelist">${rules.map(r=>`<div class="rulerow"><span>${r.name}</span><span class="tag ${r.status==='FAILURE'?'danger':'neutral'}">${ruleNames[r.status]}</span></div>`).join('')}</div><p>失败示例：检查器读取超时。不适用与未执行分别保留，历史评分不充作本次完整结果。</p>`)}
function selectChart(key,value){if(!issuesReadable())return;if(key==='domain')domain=domain===value?'':value;if(key==='status')status=status===value?'':value;if(key==='table'&&state!=='incomplete')table=table===value?'':value;page=1;render();document.getElementById('detail-title')?.focus({preventScroll:true});document.getElementById('detail-title')?.scrollIntoView({block:'nearest'})}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();showRoute(a.dataset.title,a.dataset.go);return}const d=e.target.closest('[data-domain]');if(d){selectChart('domain',d.dataset.domain);return}const s=e.target.closest('[data-status]');if(s){selectChart('status',s.dataset.status);return}const t=e.target.closest('[data-table]');if(t){selectChart('table',t.dataset.table);return}const r=e.target.closest('[data-issue]');if(r){showIssue(Number(r.dataset.issue));return}if(e.target.closest('[data-batch]')){showBatch();return}const clear=e.target.closest('[data-clear]');if(clear){if(clear.dataset.clear==='domain')domain='';if(clear.dataset.clear==='status')status='';if(clear.dataset.clear==='table')table='';page=1;render();return}if(e.target.closest('[data-reset]')){domain='';status='';table='';page=1;render();return}const pg=e.target.closest('[data-page]');if(pg&&!pg.disabled){page+=Number(pg.dataset.page);render();return}if(e.target.closest('[data-retry]')){state='normal';document.getElementById('demo-state').value=state;domain='';status='';table='';page=1;render()}});
function switchScope(){epoch++;const token=epoch;closeDialog();domain='';status='';table='';page=1;loading=true;render();setTimeout(()=>{if(token!==epoch)return;loading=false;render()},160)}
document.getElementById('datasource').addEventListener('change',e=>{source=e.target.value;snapshot=String(snapshots[source][0].id);snapshotOptions();switchScope()});document.getElementById('snapshot').addEventListener('change',e=>{snapshot=e.target.value;switchScope()});document.getElementById('demo-state').addEventListener('change',e=>{epoch++;state=e.target.value;loading=false;domain='';status='';table='';page=1;closeDialog();render()});document.getElementById('issue-entry').addEventListener('click',()=>{if(issuesReadable())showRoute('问题中心',`/admin/governance/issues?${ctx()}`)});document.getElementById('field-entry').addEventListener('click',()=>{if(state!=='forbidden'&&!loading)showRoute('字段治理',`/admin/governance/fields?tab=tasks&${ctx()}`)});document.getElementById('close-dialog').addEventListener('click',closeDialog);document.getElementById('return-dialog').addEventListener('click',closeDialog);dialog.addEventListener('close',()=>{if(trigger?.isConnected)trigger.focus()});snapshotOptions();renderNav();render();
</script></body></html>
