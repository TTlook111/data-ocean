server:
  port: 8080

spring:
  application:
    name: DataOcean
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dataocean}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:dataocean-local-dev-secret-key-change-me-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:86400}

security:
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:1800}

dataocean:
  internal:
    token: ${INTERNAL_TOKEN:dataocean-internal-default}
  python-service:
    base-url: ${PYTHON_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: ${PYTHON_SERVICE_CONNECT_TIMEOUT:5000}
    read-timeout: ${PYTHON_SERVICE_READ_TIMEOUT:120000}
    short-connect-timeout: ${PYTHON_SERVICE_SHORT_CONNECT_TIMEOUT:3000}
    short-read-timeout: ${PYTHON_SERVICE_SHORT_READ_TIMEOUT:15000}
    health-connect-timeout: ${PYTHON_SERVICE_HEALTH_CONNECT_TIMEOUT:3000}
    health-read-timeout: ${PYTHON_SERVICE_HEALTH_READ_TIMEOUT:3000}
  async:
    task:
      core-size: ${ASYNC_TASK_CORE_SIZE:4}
      max-size: ${ASYNC_TASK_MAX_SIZE:8}
      queue-capacity: ${ASYNC_TASK_QUEUE_CAPACITY:100}
      await-termination-seconds: ${ASYNC_TASK_AWAIT_TERMINATION_SECONDS:30}
    query:
      core-size: ${ASYNC_QUERY_CORE_SIZE:10}
      max-size: ${ASYNC_QUERY_MAX_SIZE:30}
      queue-capacity: ${ASYNC_QUERY_QUEUE_CAPACITY:50}
      await-termination-seconds: ${ASYNC_QUERY_AWAIT_TERMINATION_SECONDS:60}
    conversation-summary:
      core-size: ${ASYNC_SUMMARY_CORE_SIZE:2}
      max-size: ${ASYNC_SUMMARY_MAX_SIZE:8}
      queue-capacity: ${ASYNC_SUMMARY_QUEUE_CAPACITY:50}
      await-termination-seconds: ${ASYNC_SUMMARY_AWAIT_TERMINATION_SECONDS:60}
    datasource-health:
      core-size: ${DATASOURCE_HEALTH_ASYNC_CORE_SIZE:2}
      max-size: ${DATASOURCE_HEALTH_ASYNC_MAX_SIZE:8}
      queue-capacity: ${DATASOURCE_HEALTH_ASYNC_QUEUE_CAPACITY:100}
      await-termination-seconds: ${DATASOURCE_HEALTH_ASYNC_AWAIT_TERMINATION_SECONDS:30}
  metadata:
    auto-sync:
      enabled: ${METADATA_AUTO_SYNC_ENABLED:false}
      cron: ${METADATA_AUTO_SYNC_CRON:0 0 2 * * ?}
  audit:
    slow-query-threshold-ms: ${AUDIT_SLOW_THRESHOLD_MS:5000}
    retention-days: ${AUDIT_RETENTION_DAYS:180}

logging:
  level:
    com.dataocean: INFO
