spring:
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dataocean}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  # 与 application.yml 一致：不提供默认值（此处曾是同一个公开默认值的第二份副本，
  # 而 dev profile 恰恰是默认激活的，只改 application.yml 不会生效）
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400}
