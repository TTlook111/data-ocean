spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dataocean;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false

jwt:
  # 签名密钥无默认值，测试环境必须显式提供，否则所有 @SpringBootTest 启动失败。
  # 长度必须满足 JwtTokenProvider 的 32 字节下限。
  secret: test-jwt-secret-0123456789abcdefghijkl

dataocean:
  # 内部令牌无默认值，测试环境必须显式提供，否则所有 @SpringBootTest 启动失败。
  # 长度必须满足 InternalTokenValidator 的最小长度要求。
  internal:
    token: test-internal-token-0123456789abcdef
  datasource:
    encrypt-key: 12345678901234567890123456789012
    health-check:
      enabled: false
  query:
    cleanup:
      enabled: false
