spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dataocean?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: change-me
  data:
    redis:
      host: localhost
      port: 6379
      password:

jwt:
  # 必填，无默认值：未配置或不足 32 字节时应用拒绝启动。
  # 不要照抄占位符——生成一个真实随机值：openssl rand -base64 32
  # 注意：更换该值会让所有已签发的登录令牌立即失效，用户需要重新登录。
  secret:
  expiration: 86400

dataocean:
  datasource:
    encrypt-key: change-me-to-a-32-byte-secret-key
