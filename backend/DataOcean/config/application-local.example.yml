spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dataocean?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: dataocean
    # 填实际应用库账号和密码；使用可选 Compose 时密码与根目录 .env 的 MYSQL_PASSWORD 一致。
    # 根目录 .env 不会被 Java 自动读取。
    password: change-me
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:

jwt:
  # 必填，无默认值：未配置或不足 32 字节时应用拒绝启动。
  # 不要照抄占位符——生成一个真实随机值：openssl rand -base64 32
  # 注意：更换该值会让所有已签发的登录令牌立即失效，用户需要重新登录。
  secret:
  expiration: 86400

dataocean:
  internal:
    # 必填，至少 32 字符且无空白；必须与 Python 的 INTERNAL_TOKEN 一致。
    token:
  python-service:
    base-url: http://127.0.0.1:8000
  datasource:
    # 必填，32 字节密钥的 Base64；生成命令见 docs/development/本地开发与验证.md。
    # 保存后保持稳定，否则无法解密已保存的数据源密码。
    encrypt-key:
