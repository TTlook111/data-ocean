# 仅启动本地开发基础设施；Java、Python（uv）和 Vue 在宿主机运行。
# 先复制 .env.example 为 .env 并填写三个密码，详见 README.md。
name: ${COMPOSE_PROJECT_NAME:-dataocean}

services:
  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dataocean
      MYSQL_USER: dataocean
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在根目录 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp
          -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -Nse 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    # 保留镜像 entrypoint，由它加载 Redis 8 自带模块。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  redis-checkpoint:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    # checkpoint 独立实例、独立数据卷，使用 DB 0；禁止自动淘汰恢复状态。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_CHECKPOINT_PORT:-6380}:6379"
    volumes:
      - checkpoint-data:/data
    healthcheck:
      # PING 之外还检查 JSON/Search 命令是否存在，全程只读。
      test:
        - CMD-SHELL
        - >-
          redis-cli --raw ping | grep -qx PONG &&
          redis-cli --raw COMMAND INFO JSON.SET | grep -iqx 'json.set' &&
          redis-cli --raw COMMAND INFO FT.CREATE | grep -iqx 'ft.create'
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: dataocean
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在根目录 .env 中设置 MINIO_ROOT_PASSWORD（至少 8 字符）}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.6.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    # 与该版本官方 standalone 编排保持一致。
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: dataocean
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?请在根目录 .env 中设置 MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    stop_grace_period: 60s

# 使用当前 Compose 项目的命名卷，不接管已有容器、网络或 external 卷。
volumes:
  mysql-data:
  redis-data:
  checkpoint-data:
  etcd-data:
  minio-data:
  milvus-data:
